[Tussock Model]
nsims = 50
nthreads = 50
nyears = 250
filepath = test_parameterization/ALL/simulation_outputs

[Paths]
param_file = parameters/parameters.txt
output_dir = test_parameterization
training_csv = ./input_data/tussock_density_tussock_diam.csv

[Optimization]
max_evals = 200
n_init = 5
tol_f = 1e-3
tol_x = 1e-3
init_log10_span = 1.0
step_frac = 0.2
step_abs = 0.3
optimize_log_space = false
stall_expand_after = 30
stall_expand_factor = 2.0

[Constraints]
extinction_weight = 0.0
constraint_year = 25
min_alive_tillers = 25
radius_cap = 2.5
constraint_pass_frac = 0.8
alive_overflow_threshold = 400
hard_fail_on_overflow = false
require_survive_to_end_for_fit = false

[Plotting]
plot_every = 10
plot_kde = false
print_fail_breakdown = false